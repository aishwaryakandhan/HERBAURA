<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HERBAURA - Checkout</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #faf7f2;
            color: #292522;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* ================= HEADER ================= */

        header {
            background-color: white;
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            color: #4a3428;
        }

        header p {
            margin: 5px 0 0;
            color: #6b584a;
            font-size: 14px;
        }

        .home-btn {
            background-color: #a65d3b;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
        }

        .home-btn:hover {
            background-color: #4a3428;
        }


        /* ================= MAIN ================= */

        .checkout-container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;

            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }


        /* ================= ORDER SUMMARY ================= */

        .order-summary {
            flex: 1;
            min-width: 300px;

            background-color: white;
            padding: 25px;

            border-radius: 12px;

            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .order-summary h2 {
            color: #4a3428;
            margin-top: 0;
        }


        /* ================= PRODUCT BOX ================= */

        .product-box {
            display: flex;
            gap: 20px;
            align-items: center;

            border-bottom: 1px solid #ddd;

            padding: 15px 0;
        }

        .product-box:first-child {
            padding-top: 0;
        }

        .product-box img {
            width: 100px;
            height: 100px;

            object-fit: cover;

            border-radius: 10px;

            background-color: #f5f0eb;
        }

        .product-info {
            flex: 1;
        }

        .product-info h3 {
            color: #4a3428;
            margin: 0 0 8px;
        }

        .product-info p {
            color: #6b584a;
            margin: 6px 0;
        }

        .price {
            color: #a65d3b !important;
            font-size: 18px;
            font-weight: bold;
        }


        /* ================= TOTAL ================= */

        .total-section {
            margin-top: 25px;
            padding-top: 10px;
        }

        .total-section h3 {
            color: #4a3428;
        }

        #totalPrice {
            color: #a65d3b;
        }


        /* ================= FORM ================= */

        .checkout-form {
            flex: 1;
            min-width: 300px;

            background-color: white;
            padding: 25px;

            border-radius: 12px;

            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .checkout-form h2 {
            color: #4a3428;
            margin-top: 0;
        }

        label {
            display: block;

            margin-top: 15px;
            margin-bottom: 6px;

            color: #4a3428;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 6px;

            outline: none;

            font-family: Arial, Helvetica, sans-serif;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #a65d3b;
        }

        textarea {
            height: 90px;
            resize: none;
        }


        /* ================= PAYMENT ================= */

        .payment-title {
            margin-top: 20px;
            color: #4a3428;
        }

        .payment-option {
            margin: 10px 0;
        }

        .payment-option label {
            margin: 0;
            font-weight: normal;
        }

        .payment-option input {
            width: auto;
            margin-right: 8px;
        }


        /* ================= PLACE ORDER ================= */

        .place-order {
            width: 100%;

            margin-top: 25px;

            padding: 13px;

            background-color: #a65d3b;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            cursor: pointer;
        }

        .place-order:hover {
            background-color: #4a3428;
        }


        /* ================= SUCCESS ================= */

        #successMessage {
            display: none;

            width: 90%;
            max-width: 700px;

            margin: 40px auto;

            background-color: white;

            padding: 35px;

            border-radius: 12px;

            text-align: center;

            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        #successMessage h2 {
            color: #4a3428;
        }

        #successMessage p {
            color: #6b584a;
            line-height: 1.6;
        }

        .continue-btn {
            display: inline-block;

            margin-top: 15px;

            background-color: #a65d3b;

            color: white;

            text-decoration: none;

            padding: 12px 25px;

            border-radius: 5px;
        }

        .continue-btn:hover {
            background-color: #4a3428;
        }

        .orders-btn {
            display: inline-block;

            margin-top: 15px;
            margin-left: 8px;

            background-color: #4a3428;

            color: white;

            text-decoration: none;

            padding: 12px 25px;

            border-radius: 5px;
        }

        .orders-btn:hover {
            background-color: #a65d3b;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            .checkout-container {
                width: 94%;
            }

            header {
                padding: 20px;
            }

            .product-box {
                align-items: flex-start;
            }

            .product-box img {
                width: 80px;
                height: 80px;
            }

            .orders-btn {
                margin-left: 0;
            }

        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <div>

        <h1>
            🌿 HERBAURA
        </h1>

        <p>
            Natural Ayurvedic Care
        </p>

    </div>


    <a
        href="website.html"
        class="home-btn"
    >
        ← Home
    </a>

</header>



<!-- ================= CHECKOUT ================= -->

<div
    class="checkout-container"
    id="checkoutContainer"
>


    <!-- ================= ORDER SUMMARY ================= -->

    <div class="order-summary">

        <h2>
            🛍️ Order Summary
        </h2>


        <div id="productsContainer"></div>


        <div class="total-section">

            <h3>

                Total:

                <span id="totalPrice">
                    ₹0
                </span>

            </h3>

        </div>

    </div>



    <!-- ================= CUSTOMER DETAILS ================= -->

    <div class="checkout-form">

        <h2>
            📝 Customer Details
        </h2>


        <form id="checkoutForm">


            <label for="fullName">
                Full Name
            </label>

            <input
                type="text"
                id="fullName"
                placeholder="Enter your full name"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number"
                required
            >


            <label for="address">
                Address
            </label>

            <textarea
                id="address"
                placeholder="Enter your full address"
                required
            ></textarea>


            <label for="city">
                City
            </label>

            <input
                type="text"
                id="city"
                placeholder="Enter your city"
                required
            >


            <label for="pincode">
                Pincode
            </label>

            <input
                type="text"
                id="pincode"
                placeholder="Enter your pincode"
                required
            >


            <h3 class="payment-title">
                💳 Payment Method
            </h3>


            <div class="payment-option">

                <label>

                    <input
                        type="radio"
                        name="payment"
                        value="Cash on Delivery"
                        required
                    >

                    Cash on Delivery

                </label>

            </div>


            <div class="payment-option">

                <label>

                    <input
                        type="radio"
                        name="payment"
                        value="UPI"
                    >

                    UPI

                </label>

            </div>


            <div class="payment-option">

                <label>

                    <input
                        type="radio"
                        name="payment"
                        value="Card"
                    >

                    Debit / Credit Card

                </label>

            </div>


            <button
                type="submit"
                class="place-order"
            >
                🛒 Place Order
            </button>


        </form>

    </div>

</div>



<!-- ================= SUCCESS MESSAGE ================= -->

<div id="successMessage">

    <h2>
        🎉 Order Placed Successfully!
    </h2>

    <p>
        Thank you for shopping with
        <strong>HERBAURA</strong>.
    </p>

    <p>
        Your Order ID is:
        <strong id="orderId"></strong>
    </p>

    <p>
        Your order details have been saved successfully.
    </p>


    <a
        href="orders.html"
        class="orders-btn"
    >
        📦 View My Orders
    </a>


    <a
        href="website.html"
        class="continue-btn"
    >
        Continue Shopping
    </a>

</div>



<script>


/* =====================================================
   CHECK LOGIN
===================================================== */

const loggedInUser =
    JSON.parse(
        localStorage.getItem(
            "herbauraLoggedInUser"
        )
    );


if (!loggedInUser) {

    alert(
        "Please login before placing an order!"
    );

    window.location.href =
        "login.html";

}


/* =====================================================
   GET BUY NOW DATA
===================================================== */

let buyData =
    JSON.parse(
        localStorage.getItem(
            "herbauraBuyNow"
        )
    );


/* =====================================================
   CONVERT PRODUCT INTO ARRAY
===================================================== */

let products = [];


if (buyData) {

    if (Array.isArray(buyData)) {

        products = buyData;

    }

    else {

        products = [buyData];

    }

}


/* =====================================================
   DISPLAY PRODUCTS
===================================================== */

let productsContainer =
    document.getElementById(
        "productsContainer"
    );


let total = 0;


if (products.length > 0) {


    products.forEach(function(product) {


        /* PRODUCT VALUES */

        let productName =
            product.name || "Product";


        let productImage =
            product.image || "";


        let productPrice =
            Number(product.price) || 0;


        let productQuantity =
            Number(product.quantity) || 1;


        /* PRODUCT TOTAL */

        let productTotal =
            productPrice *
            productQuantity;


        total =
            total +
            productTotal;


        /* PRODUCT BOX */

        let productBox =
            document.createElement("div");


        productBox.className =
            "product-box";


        /* IMAGE */

        let image =
            document.createElement("img");


        image.src =
            productImage;


        image.alt =
            productName;


        image.onerror =
            function() {

                this.src =
                    "https://via.placeholder.com/100x100?text=Product";

            };


        /* PRODUCT INFO */

        let productInfo =
            document.createElement("div");


        productInfo.className =
            "product-info";


        productInfo.innerHTML = `

            <h3>
                ${productName}
            </h3>

            <p>
                Quantity:
                ${productQuantity}
            </p>

            <p>
                Price:
                ₹${productPrice}
            </p>

            <p class="price">
                Subtotal:
                ₹${productTotal}
            </p>

        `;


        /* ADD IMAGE */

        productBox.appendChild(
            image
        );


        /* ADD INFO */

        productBox.appendChild(
            productInfo
        );


        /* ADD PRODUCT BOX */

        productsContainer.appendChild(
            productBox
        );

    });


    /* SHOW TOTAL */

    document.getElementById(
        "totalPrice"
    ).innerText =
        "₹" + total;

}


/* =====================================================
   NO PRODUCT
===================================================== */

else {

    productsContainer.innerHTML = `

        <p style="
            color:#6b584a;
            text-align:center;
            padding:20px 0;
        ">

            No product selected.

        </p>

    `;


    document.getElementById(
        "totalPrice"
    ).innerText =
        "₹0";

}



/* =====================================================
   PLACE ORDER
===================================================== */

document
.getElementById("checkoutForm")
.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        /* ===============================
           CHECK PRODUCT
        =============================== */

        if (products.length === 0) {

            alert(
                "No product selected!"
            );

            return;

        }


        /* ===============================
           CHECK LOGIN
        =============================== */

        if (!loggedInUser) {

            alert(
                "Please login before placing an order!"
            );

            window.location.href =
                "login.html";

            return;

        }


        /* ===============================
           CUSTOMER DETAILS
        =============================== */

        let fullName =
            document.getElementById(
                "fullName"
            ).value;


        let email =
            document.getElementById(
                "email"
            ).value;


        let phone =
            document.getElementById(
                "phone"
            ).value;


        let address =
            document.getElementById(
                "address"
            ).value;


        let city =
            document.getElementById(
                "city"
            ).value;


        let pincode =
            document.getElementById(
                "pincode"
            ).value;


        /* ===============================
           PAYMENT
        =============================== */

        let paymentElement =
            document.querySelector(
                'input[name="payment"]:checked'
            );


        let payment =
            paymentElement
                ? paymentElement.value
                : "";


        /* ===============================
           CREATE ORDER ID
        =============================== */

        let orderId =
            "HERB" +
            Math.floor(
                100000 +
                Math.random() * 900000
            );


        /* ===============================
           CREATE ORDER DATA
        =============================== */

        const orderData = {

            orderId: orderId,

            username:
                loggedInUser.username,

            date:
                new Date().toLocaleString(),

            status:
                "Order Placed",

            products:
                products.map(function(product) {

                    return {

                        name:
                            product.name || "Product",

                        image:
                            product.image || "",

                        quantity:
                            Number(
                                product.quantity
                            ) || 1,

                        price:
                            Number(
                                product.price
                            ) || 0

                    };

                }),

            total:
                total,

            customer: {

                fullName:
                    fullName,

                email:
                    email,

                phone:
                    phone,

                address:
                    address,

                city:
                    city,

                pincode:
                    pincode

            },

            payment:
                payment

        };


        /* =================================================
           GET EXISTING ORDERS
        ================================================= */

        let orders = [];

        try {

            orders =
                JSON.parse(
                    localStorage.getItem(
                        "herbauraOrders"
                    )
                ) || [];

        }

        catch (error) {

            orders = [];

        }


        /* =================================================
           ADD NEW ORDER
        ================================================= */

        orders.push(
            orderData
        );


        /* =================================================
           SAVE ALL ORDERS
        ================================================= */

        localStorage.setItem(
            "herbauraOrders",
            JSON.stringify(
                orders
            )
        );


        /* =================================================
           SAVE LAST ORDER ALSO
        ================================================= */

        localStorage.setItem(
            "herbauraLastOrder",
            JSON.stringify(
                orderData
            )
        );


        /* =================================================
           REMOVE TEMPORARY BUY NOW DATA
        ================================================= */

        localStorage.removeItem(
            "herbauraBuyNow"
        );


        /* =================================================
           CLEAR CART
        ================================================= */

        localStorage.removeItem(
            "herbauraCart"
        );


        /* =================================================
           HIDE CHECKOUT
        ================================================= */

        document.getElementById(
            "checkoutContainer"
        ).style.display =
            "none";


        /* =================================================
           SHOW SUCCESS
        ================================================= */

        document.getElementById(
            "successMessage"
        ).style.display =
            "block";


        document.getElementById(
            "orderId"
        ).innerText =
            orderId;

    }
);

</script>


</body>

</html>
