<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HERBAURA - Contact Us</title>

    <style>

        body {
            background-color: #faf7f2;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            color: #292522;
        }

        header {
            background-color: white;
            padding: 20px 6%;
        }

        h1 {
            color: #4a3428;
            margin: 0;
        }

        header p {
            color: #6b584a;
            margin: 5px 0 0;
        }

        nav {
            background-color: #4a3428;
            padding: 14px 6%;
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        nav a:hover {
            color: #ffd9c7;
        }

        .contact {
            width: 400px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .contact h2 {
            text-align: center;
            color: #4a3428;
        }

        .contact p {
            color: #6b584a;
        }

        label {
            color: #4a3428;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
        }

        button {
            width: 100%;
            background-color: #a65d3b;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4a3428;
        }

    </style>

</head>

<body>

    <header>

        <h1>🌿 HERBAURA</h1>

        <p>Natural Ayurvedic care</p>

    </header>


    <nav>

        <a href="website.html">HOME</a>

        <a href="deals.html">DEALS</a>

        <a href="contact.html">CONTACT US</a>

        <a href="cart.html">🛒 MY CART</a>

        <a href="login.html">👤 LOGIN</a>

    </nav>
    


    <section class="contact">

        <h2>📩 Contact Us</h2>

        <p>Have any questions? Contact us!</p>

        <form>

            <label>Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Message</label>
            <textarea placeholder="Enter your message"></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

    </section>

</body>

</html>
